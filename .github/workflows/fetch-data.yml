name: Fetch raw data

# Downloads the raw NHS England / NHS England Digital / ONS / OHID files into
# data/raw/<source>/ and commits them back to the branch.
# Each source runs as its own job (in parallel) and uploads its files as an
# artifact, so a slow or failing source never loses the others; a final job
# merges whatever succeeded and commits it.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "JSON list of sources to fetch"
        required: false
        default: '["fingertips","kh03_overnight","kh03_main","ga_sitreps","ae_attendances","discharge_acute","dtoc","hes_apc","ons_population"]'
  push:
    paths:
      - scripts/fetch_raw_data.py
      - .github/workflows/fetch-data.yml

permissions:
  contents: write

concurrency:
  group: fetch-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(github.event.inputs.sources || '["fingertips","kh03_overnight","kh03_main","ga_sitreps","ae_attendances","discharge_acute","dtoc","hes_apc","ons_population"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Fetch ${{ matrix.source }}
        # A headed browser under a virtual display passes bot challenges more reliably.
        run: xvfb-run -a python scripts/fetch_raw_data.py --headed --only ${{ matrix.source }}
      - name: Keep files even if the fetch step failed part-way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.source }}
          path: data/raw/${{ matrix.source }}
          if-no-files-found: ignore
          retention-days: 7

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: artifacts
      - name: Merge into data/raw
        run: |
          mkdir -p data/raw
          for d in artifacts/raw-*; do
            [ -d "$d" ] || continue
            src="${d#artifacts/raw-}"
            mkdir -p "data/raw/$src"
            cp -r "$d"/. "data/raw/$src/"
          done
          pip install requests beautifulsoup4
          python scripts/fetch_raw_data.py --combine-only
          du -sh data/raw/* || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fetch raw data files ($(date -u +%Y-%m-%d)) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 10
          done
