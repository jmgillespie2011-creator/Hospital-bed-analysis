name: Model tests

on:
  push:
    paths: ["web/js/**", "tests/**", "scripts/calibrate.mjs", "web/data/baseline.json", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/model.test.mjs
